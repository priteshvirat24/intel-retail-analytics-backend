<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#003C71" />
    </linearGradient>
    <linearGradient id="intelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071C5" />
      <stop offset="100%" stop-color="#00C7FD" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="16" />
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#334155" stroke-width="2" rx="12" />
  
  <!-- Store Tag -->
  <rect x="50" y="50" width="160" height="36" rx="8" fill="#1E293B" />
  <text x="130" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Walmart</text>
  
  <!-- Brand Badge -->
  <rect x="220" y="50" width="200" height="36" rx="8" fill="url(#intelGrad)" />
  <text x="320" y="74" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Intel</text>

  <!-- Headline -->
  <text x="50" y="160" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Intel Core Powered Everyday Laptops for Back-</text>
  <text x="50" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18">HP, Lenovo, and ASUS laptops starting under $499.</text>
  
  <!-- Discount Badge -->
  <rect x="50" y="250" width="450" height="60" rx="10" fill="#0071C5" opacity="0.9" />
  <text x="70" y="288" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">🏷️ Rollback: $150 Off HP Pavilion Intel Core i5</text>

  <!-- CTA Button -->
  <rect x="950" y="260" width="180" height="50" rx="10" fill="#00C7FD" />
  <text x="1040" y="292" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Shop Deals →</text>
  
  <!-- Footer Proof of Concept Label -->
  <text x="1130" y="365" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">POC Benchmark Reference Capture • walmart-us</text>
</svg>