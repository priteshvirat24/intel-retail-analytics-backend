"AggregateRating","ratingValue":"4.4","ratingCount":"12"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Testpilot Kati"},"datePublished":"2026-07-22T20:31:15.000+00:00","name":"Superleichtes, leises Notebook","reviewBody":"Es eignet sich hervorragend für alltägliche Arbeiten wie Surfen im Netz, Streamin von Filmen und Serien und für die Schule und Uni, da es federleicht und kompakt ist. Es arbeitet flüssig und der Akku hält bei normalen Betrieb mindestens einen Tag durch. Das Display ist auch im freien im Schatten noch gut erkennbar, die Farben sind weich und natürlich. Die Webcam hat eine mechanische Abdeckung, sodas man nicht überkleben muss. Die Tastatur ist hervorragend. Es macht Spaß selbst lange Texte zu schreiben. Einfache Videospiele schafft es auch. Bei Spielen mit viel Grafik kommt es schnell an seine Grenzen. Für meine Zwecke ist es aber völlig ausreichend, Schreiben erstellen, Steamen, im Netz surfen. Zum Mitnehmen wunderbar geeignet. Super Preis Leistungsverhältnis."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"sthorwarth"},"datePublished":"2026-07-21T14:07:52.000+00:00","name":"Tolles superleichtes Gerät mit schnellem Start!","reviewBody":"Ich durfte das LENOVO IdeaPad Slim 3 als MediaMarkt-Testpilotin ausgiebig prüfen. Technisch ist es ein absolut solides Gerät, das mich vor allem durch seine enorme Schnelligkeit im Alltag begeistert. Es fährt blitzschnell hoch, ist sofort einsatzbereit und läuft durchweg flüssig. Zusammen mit dem sehr geringen Gewicht ist es ein perfekter Begleiter für unterwegs. Wer bei der Ersteinrichtung aufpasst und ein passendes Ladekabel parat hat, bekommt hier ein richtig starkes Arbeitsgerät."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":5},"author":{"@type":"Person","name":"Nordlicht123"},"datePublished":"2026-07-20T15:17:07.000+00:00","name":"Guter Laptop, klare Displayauflösung","reviewBody":"Ein guter Laptop für den Hausgebrauch. Fährt schnell und problemlos hoch.\r\nDurch Vorinstallationen schnell und problemlos einsatzbereit. \r\nDie Akkulaufzeit fand ich sehr gut, stundenlanges Arbeiten ist ohne Probleme möglich.\r\nVon mir eine klare Kaufempfehlung!"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"Icewolf77"},"datePublished":"2026-07-15T17:35:42.000+00:00","name":"Guter Office Rechner","reviewBody":"Der Laptop ist schön kompakt und kann dadurch gut zu Schule, Arbeit oder Studium mitgenommen werden. Zum Arbeiten ist er gut geeignet, die 8 GB RAM reichen gerade so für flüssigen Workflow. Auch sonstige Standardaufgaben bringen das Gerät nicht ins Schwitzen, Netflix, Youtube, Office und Bildbearbeitung sind kein Problem. Zocken kann man damit aber maximal ein paar kleinere Indie- oder Browserspiele, dafür ist das Gerät nicht gedacht. Besonders hervorheben kann man das gute IPS Display mit der Low Blue Light Technologie und guter Blickwinkelstabilität. Das Gehäuse ist hier nicht ganz so stabil und lässt sich leicht verwinden, da wurde etwas am Material gespart. Trotzdem bringt die Tastatur einen guten Anschlag und man kann flott und flüssig darauf tippen. Das Touchpad ist wieder etwas sensibel, man gewöhnt sich aber gut dran. Von den Anschlüssen her hat man eigentlich alles, was man benötigt, genügend flotte USB Ports sind vorhanden. Geladen wird über die USB-C Buchse, leider muss man das Netzteil selbst beisteuern. Kurioserweise wird der Anschluss eines Hohlsteckernetzteils auf der Displayschutzfolie angezeigt, scheint wohl ein allgemeines Anschlussbild zu sein, denn es gibt ja weder Netzteil, noch einen Hohlsteckeranschluss. Auch der Akku ist nicht der größte, nach einer kompletten Ladung hat man maximal 3-4 Stunden bei durchschnittlichem Gebrauch zur Verfügung. Insgesamt ein solides Gerät zum Arbeiten unterwegs, ordentlich verarbeitet und mit gutem Display ausgestattet."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"Jóhannson"},"datePublished":"2026-07-10T23:09:43.000+00:00","name":"Ein Klasse  Laptop für den täglichen Hausgebrauch","reviewBody":"Display ist gestochen scharf und farbenfroh \r\nDas System startet in nur wenigen Sekunden\r\nDie Tastatur hat einen angenehmen Druckpunkt und ist auch für längeres Schreiben ideal"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"Guenther"},"datePublished":"2026-07-10T10:28:54.000+00:00","name":"Sehr guter Laptop. Klare Displayauflösung","reviewBody":"Das Gerät fährt sehr schnell hoch. Beim Ausschalten kann zwischen herunterfahren oder Deckel zu klappen gewählt werden. Die Bildschirmauflösung ist sehr gut vor eingestellt. Durch die Vorinstallationen ist der Laptop schnell einsatzbereit. Die Verbindung zu einen Router konnte schnell hergestellt werden. Die Anwendungen öffnen schnell. Durch das Ausfüllen des Monitors über die komplette Deckelfläche ist eine gute TV- Anschauung möglich.(z.B. über Netflix). Die Tonqualität hierbei muss aber noch eingestellt werden. Der Akku ist sehr lange einsatzbereit. Bei der Erstinstallation sollte man bei den Lenovo Systemeinstellungen jedoch einige Punkte anpassen, um nicht ständig analysiert zu werden. Mit der Kamera kann man recht gute Momentaufnahmen machen. Die Tastatur lässt sich gut bedienen. Jedoch das Touchpanel ist für ältere Menschen etwas zu sensibel eingestellt. Ich habe mit dem Gerät mit den Office-Programmen gearbeitet. Habe mir Bilder über USB-Speicher angeschaut. Musikstücke angehöhrt, wobei hier über den Equalizer die Tonqualität gut einstellbar ist. Videos über Netflix angeschaut."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"theranikolos"},"datePublished":"2026-07-08T18:59:08.000+00:00","name":"Kompakt und zuverlässig, aber ohne Netzteil","reviewBody":"Ich nutze das Lenovo IdeaPad Slim 3 nun seit einiger Zeit im Alltag und bin insgesamt zufrieden. Besonders gut gefällt mir die kompakte Größe. Das Notebook ist leicht und lässt sich problemlos transportieren, weshalb es sich meiner Meinung nach sehr gut für Reisen eignet. Auch auf kleineren Schreibtischen nimmt es nicht viel Platz ein, was ich als sehr praktisch empfinde.\r\n\r\nDas Display macht einen guten Eindruck und bietet eine angenehme Bildqualität. Für meine tägliche Nutzung mit Office-Anwendungen, Internet, Streaming und allgemeinen Aufgaben arbeitet das System flüssig und zuverlässig. Programme starten schnell und die Bedienung ist insgesamt angenehm.\r\n\r\nEin großer Minuspunkt ist für mich allerdings, dass dem Notebook kein Netzteil beiliegt. Ich hatte bisher noch nie einen Laptop gekauft oder genutzt, bei dem das Ladekabel beziehungsweise Netzteil separat beschafft werden musste. Gerade bei einem neuen Notebook finde ich das unverständlich und wenig kundenfreundlich. Wer kein passendes USB-C- oder Lenovo-Netzteil zu Hause hat, muss zusätzliche Kosten einplanen.\r\n\r\nAußerdem merkt man bei den 8 GB Arbeitsspeicher, dass das Notebook an seine Grenzen kommt, wenn mehrere Programme oder viele Browser-Tabs gleichzeitig geöffnet sind. Für normale Office-Arbeiten reicht die Leistung aus, bei stärkerem Multitasking hätte ich mir jedoch 16 GB RAM gewünscht.\r\n\r\nInsgesamt ist das Lenovo IdeaPad Slim 3 ein gelungenes Notebook für den Alltag, insbesondere wenn man ein leichtes und mobiles Gerät für Office, Internet und Streaming sucht. Mit einem beiliegenden Netzteil und etwas mehr Arbeitsspeicher wäre es für mich nahezu perfekt."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"Nicole"},"datePublished":"2026-07-08T08:25:14.000+00:00","name":"Solider Laptop für den Alltag","reviewBody":"Ich benutze den Laptop jetzt schon einige Tage und bin insgesamt ganz zufrieden, aber perfekt ist er nicht.\r\n\r\nDer Laptop ist ungefähr so groß wie ein DIN-A4-Blatt (36x26x18mm). Mit seinem Gewicht von nur 1,7kg ist er federleicht und somit auch für unterwegs hervorragend geeignet. Die unterschiedlichen Anschlüsse decken alles Nötige ab. Es befinden sich ein USB-C, 2 USB, ein SD-Karten Slot, HDMI und ein 3,5mm Audioanschluss an den Seiten.\r\n\r\nDas Starten des Laptops sowie das Öffnen der einzelnen Programme geht dank der SSD ziemlich schnell und diese laufen flüssig.\r\nFür normale Aufgaben wie Surfen im Internet, E-Mails schreiben, Online-Banking, YouTube oder Netflix schauen und ein bisschen Office reicht die Leistung auf jeden Fall aus. Sobald aber mehrere Programme gleichzeitig laufen oder man etwas Anspruchsvolleres macht, merkt man schon, dass er teilweise etwas langsamer läuft.\r\n\r\nDas Design ist schlicht aber modern gehalten. Der Bildschirm wird voll ausgeschöpft, da er nur von einem kleinen Rahmen umgeben ist und so eine optimale Bildschirmgröße aufweisen kann.\r\nDas Display ist okay, aber haut mich jetzt nicht vom Hocker. Für den Alltag reicht es, die Farben und Helligkeit könnten aber etwas kräftiger sein. Da der Display entspiegelt ist, stören bei der Nutzung keine Reflexionen, was das arbeiten am Notebook angenehm macht.\r\n\r\nAußerdem enthält der Lenovo Laptop das Low Blue Light Siegel. Das bedeutet, das Blaulicht wird reduziert, was die Augen schonen und somit das längere Arbeiten für die Augen angenehmer machen soll. \r\n\r\nDie eingebaute Webcam ist mit einer mechanischen Abdeckung versehen, sodass man die Kamera bei Nichtbenutzung einfach manuell abdecken kann.\r\n\r\nDer vollgeladene Akku hält bei normaler Nutzung ordentlich durch (ca. 8 Stunden), könnte meiner Meinung nach aber ruhig etwas länger halten. Ein Netzteil liegt im Lieferumfang nicht bei und muss zusätzlich erworben werden. Nach der Nutzung eines 65W Ladegerätes ist der Laptop nach ca. 15min wieder für 2 Stunden betriebsbereit. \r\n\r\nMein Fazit: \r\nDer Lenovo Ideapad Slim 3 ist ein solider Laptop für den Alltag. Wer hauptsächlich im Internet unterwegs ist, Office nutzt oder Filme schaut, bekommt ein zuverlässiges Gerät. Wer allerdings oft viele Programme gleichzeitig nutzt oder etwas mehr Leistung braucht, wird wahrscheinlich irgendwann an die Grenzen stoßen. \r\nFür den Preis finde ich ihn trotzdem fair und würde ihn mit kleinen Einschränkungen weiterempfehlen."},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":4},"author":{"@type":"Person","name":"mic_k99"},"datePublished":"2026-07-08T07:27:03.000+00:00","name":"Zuverlässiges und leichtes Alltags-Notebook","reviewBody":"Ich nutze das Lenovo IdeaPad Slim 3 jetzt seit ein paar Tagen und bin insgesamt zufrieden. Es ist angenehm leicht, läuft flüssig und erledigt seine Aufgaben zuverlässig. Mein einziger echter Kritikpunkt im Alltag ist das Ladekabel. Für die Uni oder das Homeoffice ist das Notebook eine gute Wahl.\r\nSchon beim Auspacken fällt das extrem geringe Gewicht auf. Das Notebook ist super kompakt und flach, wodurch es problemlos in jeden Rucksack passt und der ideale Begleiter für unterwegs ist. Die Einrichtung ging super schnell. Egal ob man viele Tabs im Browser offen hat oder nebenbei Musik hört – die Performance passt für den normalen Alltag absolut. Das matte Display ist ebenfalls ein Pluspunkt, weil es auch bei hellem Licht kaum spiegelt.\r\nDer größte Kritikpunkt ist für mich ganz klar die Stromversorgung: Dass das Ladekabel keinen USB-C-Anschluss hat, schränkt die Flexibilität im Alltag spürbar ein."}],"offers":{"@type":"Offer","priceCurrency":"EUR","price":499,"itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","url":"https://www.mediamarkt.de/de/product/_lenovo-ideapad-slim-3-15amn8-156-zoll-amd-ryzentm-5-40-8-gb-512-gb-amd-radeontm-610m-windows-11-home-3032675.html","shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":{"@type":"DefinedRegion","addressCountry":{"@type":"Country","name":"DE"}},"shippingRate":{"@type":"MonetaryAmount
