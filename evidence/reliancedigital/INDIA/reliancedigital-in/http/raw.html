ry_code && phone?.phone ? \"+\" + phone.country_code + phone.phone : \"\";\n\n   copilot?.(\"event\", \"setUser\", {\n     hostId: user?.user_id,\n     name: `${user?.first_name?.trim()} ${user?.last_name?.trim()}`,\n     email,\n     phone: formattedPhone,\n     profilePicUrl: user?.profile_pic_url,\n   });\n} else {\n   console.log(\"\u003E\u003E\u003E Reliance Digital: user not logged in\");\n   copilot?.(\"event\", \"unsetUser\");\n}\n}, 1500);\n\n\n\u002F* Start : script to move chatbot from botttom in msite *\u002F\n(function () {\n  const MOBILE_QUERY = '(max-width: 767px)';\n  const BOTTOM_VALUE = '75px';\n\n  function applyBottom() {\n    const host = document.querySelector('#widget-copilot');\n    const root = host?.shadowRoot;\n    const widget = root?.querySelector('#copilotWidget');\n\n    if (!widget) return false;\n    if (!window.matchMedia(MOBILE_QUERY).matches) return true;\n\n    widget.style.setProperty('bottom', BOTTOM_VALUE, 'important');\n    return true;\n  }\n\n  function attachWatcher() {\n    const host = document.querySelector('#widget-copilot');\n    const root = host?.shadowRoot;\n\n    if (!host || !root) return false;\n\n    const observer = new MutationObserver(() =\u003E {\n      applyBottom();\n    });\n\n    observer.observe(root, {\n      childList: true,\n      subtree: true,\n      attributes: true,\n      attributeFilter: ['style', 'class'],\n    });\n\n    applyBottom();\n    window.addEventListener('resize', applyBottom);\n    return true;\n  }\n\n  const poll = setInterval(() =\u003E {\n    if (attachWatcher()) {\n      clearInterval(poll);\n    }\n  }, 100);\n\n  setTimeout(() =\u003E clearInterval(poll), 15000);\n})();\n\u002F* End : script to move chatbot from botttom in msite *\u002F","_id":"6a44b8eb72a513dd000d55c3","name":"Kaily Chatbot Script","type":"js","sub_type":"inline","compatible_engines":["vue2","react"],"position":"body-bottom","pages":[{"page_slug":"faq","type":"system"},{"page_slug":"home","type":"system"}
